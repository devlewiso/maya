# OBSOLETO: el sitio ya no se despliega en Netlify. Producción = Cloudflare (Workers Builds, proyecto astromaya),
# automático en cada push a main. Este archivo quedó de antes y no se usa.
[build]
  command = "npm run build"
  publish = ".next"

  [build.environment]
    # NEXT_PUBLIC_* variables are public by design in Next.js
    # Exclude them from secret scanning to avoid false positives
    SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_BETTER_AUTH_URL"
    # DATABASE_URL contiene credenciales pero es necesaria en build (SSG/tipos)
    SECRETS_SCAN_OMIT_PATHS = ".next/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
